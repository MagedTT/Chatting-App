<div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
    <div class="row w-100 justify-content-center">
        <div class="col-md-6">

            <h2 class="text-center text-dark mt-5">
                Welcome to ChatHub
            </h2>
            <div class="text-center text-dark mb-5">
                Please Join the Room to start Chatting
            </div>

            <div class="card my-5">
                <form [formGroup]="joinRoomForm" class="card-body cardbody-color p-lg-5">
                    <div class="mb-3">
                        <input type="text" class="form-control" id="displayname" placeholder="Display Name"
                            formControlName="user">
                    </div>
                    <div class="mb-3">
                        <input type="text" class="form-control" id="roomname" placeholder="Room Name"
                            formControlName="room">
                    </div>
                    <div class="text-center">
                        <button (click)="joinRoom()" [disabled]="joinRoomForm.invalid" type="submit"
                            class="btn btn-outline-dark px-5 mb-5 w-100">Join</button>
                    </div>
                </form>
            </div>

        </div>
    </div>
</div>
